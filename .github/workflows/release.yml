name: Release

# Builds the Windows .exe and publishes a GitHub release; the app's updater installs
# from the newest release. Start it either by pushing a tag like v2.0.1 (matching
# __version__ in paradox_mod_manager.py) or from the Actions tab ("Run workflow"),
# which tags the current commit as v<__version__> itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Work out the release tag
        shell: bash
        run: |
          v=$(python paradox_mod_manager.py --version)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$v" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $v"; exit 1
            fi
          elif gh release view "v$v" >/dev/null 2>&1; then
            echo "::error::Release v$v already exists - bump __version__ first"; exit 1
          fi
          echo "TAG=v$v" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build ParadoxModManager.exe
        run: |
          python -m pip install --upgrade "pyinstaller>=6,<7"
          pyinstaller --noconfirm --onefile --windowed --name ParadoxModManager paradox_mod_manager.py

      - name: Checksums
        shell: bash
        run: |
          cp paradox_mod_manager.py dist/
          cd dist
          for f in ParadoxModManager.exe paradox_mod_manager.py; do
            sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"
          done
          ls -l

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ["TAG"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(tag)}\b.*?$(.*?)(?=^## |\Z)", text, re.S | re.M)
          body = (m.group(1).strip() if m else "") or "See CHANGELOG.md."
          body += "\n\n**Download:** `ParadoxModManager.exe` (Windows, no install needed). Existing users get this automatically via the in-app updater."
          open("notes.md", "w", encoding="utf-8").write(body)
          PY

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" \
            dist/ParadoxModManager.exe dist/ParadoxModManager.exe.sha256 \
            dist/paradox_mod_manager.py dist/paradox_mod_manager.py.sha256 \
            --title "Paradox Mod Manager $TAG" --notes-file notes.md
